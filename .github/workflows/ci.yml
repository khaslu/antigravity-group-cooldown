name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Test C-Shared Build (Linux amd64)
        run: go build -buildmode=c-shared -o bin/antigravity-group-cooldown.so .
